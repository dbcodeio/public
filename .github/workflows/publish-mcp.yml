name: Publish MCP launcher

# Publishes @dbcode/mcp (the `npx` launcher for DBCode's MCP server, in mcp/) to
# npm, then its server.json to the official MCP Registry as io.dbcode/dbcode.
# Run by hand when mcp/ changes. The launcher starts whatever DBCode is installed,
# so it does not follow extension releases.
#
# Versions are not kept in the repo: package.json and server.json hold 0.0.0, and
# each run publishes the next patch after the version npm already has. If npm is
# ahead of the MCP Registry (an earlier run failed after the npm publish), a run
# registers that version instead of publishing a new one.
#
# npm: trusted publishing (this workflow's OIDC identity), no token stored.
# MCP Registry: DNS auth for dbcode.io; MCP_REGISTRY_KEY is the hex Ed25519
# private key whose public half is in dbcode.io's TXT record.
#
# DO NOT ADD A pull_request OR pull_request_target TRIGGER (see build-and-publish.yml).
on:
  workflow_dispatch:

concurrency:
  group: publish-mcp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Test
        run: npm test

      - name: Pick the version
        id: version
        run: |
          if [ "$(jq -r .mcpName package.json)" != "$(jq -r .name server.json)" ]; then
            echo "::error::package.json mcpName does not match server.json name"
            exit 1
          fi
          on_npm=$(npm view @dbcode/mcp version)
          on_registry=$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$(jq -r .name server.json)&version=latest" | jq -r '.servers[0].server.version // ""')
          # npm ahead of the registry means an earlier run published to npm but not the
          # registry: register that version instead of publishing another.
          if [ "$on_npm" != "$on_registry" ]; then
            version=$on_npm
            echo "publish_npm=false" >> "$GITHUB_OUTPUT"
            echo "Registering $version (npm has it, the registry has ${on_registry:-nothing})"
          else
            version=$(node -p "const [a, b, c] = '$on_npm'.split('.').map(Number); [a, b, c + 1].join('.')")
            echo "publish_npm=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $version (npm and the registry have $on_npm)"
          fi
          npm version "$version" --no-git-tag-version
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.version.outputs.publish_npm == 'true'
        run: npm publish --access public

      - name: Wait for npm to serve the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A new version takes a minute or two to appear; the registry checks npm for it.
          for attempt in $(seq 1 30); do
            if [ "$(curl -fsS "https://registry.npmjs.org/@dbcode%2fmcp/$VERSION" | jq -r .version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm serves $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm still does not serve $VERSION after 5 minutes; re-run this workflow to register it"
          exit 1

      - name: Install mcp-publisher
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      - name: Publish to the MCP Registry
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          "$RUNNER_TEMP/mcp-publisher" login dns --domain dbcode.io --private-key "$MCP_REGISTRY_KEY"
          "$RUNNER_TEMP/mcp-publisher" publish
