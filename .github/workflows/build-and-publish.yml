name: Build and publish

# Builds the DBCode extension from the private source at an exact commit, scans it
# for malware, attests it, syncs release content into this repo, creates the GitHub
# release, and publishes to both marketplaces. The source is never written to this
# repository; it is checked out with a read-only deploy key and discarded with the
# runner.
#
# This workflow validates nothing about the source. Release-readiness checks, such
# as translation catalog assembly, live in the private release workflow and run
# before it pushes the bump and dispatches here. This builds the commit it is
# handed.
#
# actions/attest-build-provenance signs only this repo's own OIDC claims, so the
# dispatch payload's source commit never reaches the attestation directly. We
# bind the two ourselves: the "Stamp build provenance" step writes the source
# commit into build-provenance.json inside the checked-out tree, before
# packaging, so it becomes part of the vsix the attestation signs. The binding
# is indirect, through the artifact digest, but it is what makes the claimed
# commit tamper-evident.
#
# Attestation runs last among the gates, only after both antivirus gates pass.
# Sigstore transparency-log entries are permanent and public, so we sign only
# artifacts that cleared every gate, rather than logging attestations for builds
# that were rejected and never shipped.
#
# Everything that syncs content, creates the release, or publishes runs only after
# attest, both directly and transitively through needs:, so nothing ships anything
# for a build the AV gates or attestation have not cleared. The sync payload (the
# small set of files that need to land in this repo, not the whole workspace) is
# staged and uploaded as its own artifact in build, and downloaded by the job that
# performs the sync - jobs do not share a workspace, and syncing cannot run inside
# build because at that point the AV gates have not run yet.
#
# DO NOT ADD A pull_request OR pull_request_target TRIGGER.
#
# This repo is public and holds the publishing credentials. The absence of a PR
# trigger is what keeps them unreachable. pull_request_target is the specific
# trap: unlike pull_request, it hands secrets to forked code.
#
# PR CI belongs in a separate workflow with no secrets, not a trigger here.
on:
  repository_dispatch:
    types: [release]

concurrency:
  # Keyed on the workflow, not the version: two releases must queue behind each
  # other, never run concurrently. Different versions racing would let two
  # sync-content jobs push to main at once.
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HUSKY: '0'
    steps:
      - name: Validate dispatch payload
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Rejected commit sha (must be exactly 40 hex characters): $SHA"
            exit 1
          fi

      - name: Record what this run is building
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA: ${{ github.event.client_payload.sha }}
          ACTOR: ${{ github.event.client_payload.actor }}
        run: |
          {
            echo "## Release $VERSION"
            echo
            echo "- source commit: \`$SHA\`"
            echo "- initiated by: @$ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dbcodeio/vscode-private
          ref: ${{ github.event.client_payload.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-tags: true

      - name: Verify the dispatched commit matches the release tag and version
        # The only prior check was a 40-hex shape check on the sha: this workflow's
        # repository_dispatch trigger accepts any sha, unlike the old push: tags: v*
        # trigger that only let a tagged commit ship. Restore that guarantee: the
        # private repo's v<version> tag must point at the dispatched commit, and the
        # checked-out package.json must report that same version. client_payload
        # fields are attacker-shaped, so they are read only via env:, never
        # interpolated into this script. fetch-tags above pulled every tag while
        # SOURCE_DEPLOY_KEY was still live; persist-credentials: false tears the key
        # down right after checkout, so this check is local-only (git rev-parse, no
        # network) and works whether or not the tag actually matches.
        env:
          SHA: ${{ github.event.client_payload.sha }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          if ! tagged=$(git rev-parse --verify "refs/tags/v${VERSION}^{commit}" 2>/dev/null); then
            echo "::error::Tag v${VERSION} not found in dbcodeio/vscode-private"
            exit 1
          fi
          tagged_lc=$(echo "$tagged" | tr '[:upper:]' '[:lower:]')
          sha_lc=$(echo "$SHA" | tr '[:upper:]' '[:lower:]')
          if [ "$tagged_lc" != "$sha_lc" ]; then
            echo "::error::v${VERSION} points at $tagged, not the dispatched commit $SHA"
            exit 1
          fi
          pkg=$(jq -r .version package.json)
          if [ "$pkg" != "$VERSION" ]; then
            echo "::error::package.json is $pkg, dispatch said $VERSION"
            exit 1
          fi
          echo "Verified: v${VERSION} == $SHA, package.json version == $VERSION"

      - name: Stamp build provenance
        env:
          SHA: ${{ github.event.client_payload.sha }}
          VERSION: ${{ github.event.client_payload.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg sourceRepository "https://github.com/dbcodeio/vscode-private" \
            --arg sourceCommit "$SHA" \
            --arg version "$VERSION" \
            --arg buildWorkflowRun "$RUN_URL" \
            '{sourceRepository: $sourceRepository, sourceCommit: $sourceCommit, version: $version, buildWorkflowRun: $buildWorkflowRun}' \
            > build-provenance.json

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Package
        run: pnpm dlx @vscode/vsce@3.9.2 package --no-dependencies --no-git-tag-version --no-update-package-json --allow-package-secrets privatekey
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension
          path: '*.vsix'
          if-no-files-found: error
          # This repo is public, so run artifacts are readable by any GitHub user, and
          # this one is uploaded before either AV gate or attestation runs. Keep it
          # around only long enough to move bytes to the next job in this run.
          retention-days: 1

      - name: Stage sync payload
        # Exactly the files the sync job pushes to this repo's main, laid out to
        # match their destination paths (root, l10n/, public/). Nothing else from
        # this workspace is uploaded.
        run: |
          mkdir -p sync-payload/l10n sync-payload/public
          cp README.md CHANGELOG.md licenses.json sbom.cdx.json LICENSE package.json sync-payload/
          cp package.nls*.json sync-payload/l10n/
          cp l10n/* sync-payload/l10n/
          cp out/public/* sync-payload/public/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-payload
          path: sync-payload
          if-no-files-found: error
          retention-days: 1

  # Antivirus gate - ClamAV scan of the packaged vsix. Fails the release if
  # ClamAV flags anything in the artifact a customer's AV could block. The mangled
  # obfuscator config plus vendor XOR neutralization must keep this clean; a hit stops the
  # release for investigation rather than allowlisting the pattern.
  scan-clamav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    needs: [build]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
      - name: ClamAV scan
        run: |
          sudo apt-get update -qq && sudo apt-get install -y clamav >/dev/null
          # apt auto-starts the clamav-freshclam daemon, which locks the freshclam log;
          # stop it so a manual signature download can run.
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          vsix=$(find . -iname '*.vsix' | head -1)
          echo "Scanning $vsix"
          mkdir -p extracted && unzip -q "$vsix" -d extracted
          # clamscan exits 1 on detection, 0 clean, 2 on error - any non-zero fails the job.
          clamscan -r --detect-pua=yes --heuristic-alerts=yes \
            --alert-broken=yes --alert-encrypted=yes --alert-macros=yes \
            --scan-pe=yes --scan-html=yes --scan-archive=yes --bytecode=yes \
            --max-filesize=400M --max-scansize=2000M --max-files=200000 \
            extracted

  # Antivirus gate - Windows Defender scan of the packaged vsix. Defender does
  # not currently flag our obfuscated build (proven in CI), but it is kept as a release
  # canary: if a future change trips Defender, this blocks the publish rather than shipping
  # a build that Windows users' real-time protection would quarantine.
  scan-defender:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions: {}
    needs: [build]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
      - name: Windows Defender scan
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          # Maximize detection: cloud-delivered protection (MAPS) at the most aggressive
          # level plus PUA protection, with current signatures.
          try {
            Set-MpPreference -MAPSReporting Advanced
            Set-MpPreference -SubmitSamplesConsent SendAllSamples
            Set-MpPreference -CloudBlockLevel High
            Set-MpPreference -CloudExtendedTimeout 50
            Set-MpPreference -PUAProtection Enabled
          } catch { Write-Host "MpPreference config: $($_.Exception.Message)" }
          & $mp -SignatureUpdate 2>&1 | Out-Host
          $vsix = (Get-ChildItem *.vsix)[0].FullName
          Copy-Item $vsix pkg.zip
          Expand-Archive pkg.zip -DestinationPath extracted -Force
          & $mp -Scan -ScanType 3 -File "$PWD\extracted" -DisableRemediation 2>&1 | Out-Host
          $code = $LASTEXITCODE
          Write-Host "Defender tree scan exit code: $code (2 = threat found, 0 = clean)"
          if ($code -eq 2) {
            Get-MpThreat | Format-List | Out-Host
            Write-Error "Windows Defender flagged the packaged extension."
            exit 1
          }

  # Attestation happens only after both antivirus gates pass, and only here: Sigstore
  # transparency-log entries are permanent and public, so we sign artifacts that cleared
  # every gate rather than logging attestations for builds that were rejected and never
  # shipped. Downloads the same "extension" artifact the scans just cleared and attests
  # that exact file - actions/upload-artifact and actions/download-artifact round-trip
  # file bytes unchanged, so the digest this signs matches the one the scans checked.
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    needs: [build, scan-clamav, scan-defender]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
      - name: Attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: '*.vsix'

  # Syncs release content (README, CHANGELOG, licenses, sbom, package.json, l10n,
  # public/) into this repo's main branch. This repo IS the public repo, so there is
  # no separate clone-and-push-elsewhere step, we just check ourselves out and commit.
  # GITHUB_TOKEN cannot push to main once the branch ruleset is in place, so this
  # pushes over SSH with the deploy key, the ruleset's only bypass actor.
  sync-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [attest]
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout public repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repository_dispatch's github.sha is public main's head at DISPATCH time,
          # not now: the build plus both AV gates plus attestation take 12-25 minutes,
          # long enough for another commit to land on main in between. An explicit
          # ref: main checks out the branch tip instead of that stale sha.
          ref: main
          ssh-key: ${{ secrets.PUBLIC_RELEASE_DEPLOY_KEY }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sync-payload
          path: sync-payload

      - name: Sync content and push
        id: push
        run: |
          cp sync-payload/README.md sync-payload/CHANGELOG.md sync-payload/licenses.json \
            sync-payload/sbom.cdx.json sync-payload/LICENSE sync-payload/package.json .
          cp sync-payload/l10n/* l10n/
          cp sync-payload/public/* public/
          git config user.name "Actions CI"
          git config user.email "username@users.noreply.github.com"
          git add README.md CHANGELOG.md licenses.json sbom.cdx.json LICENSE package.json l10n public
          git diff --cached --quiet || git commit -m "Update README, CHANGELOG, package.json, l10n, licenses and public scripts"
          # Close the remaining window between checkout and push: reconcile with
          # whatever landed on main in the meantime instead of pushing blind. Still
          # authenticates with the deploy key persisted by the checkout step above
          # (persist-credentials defaults to true there), never GITHUB_TOKEN.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Creates the GitHub release on this repo with the vsix and SBOM attached. Idempotent:
  # skips only once the vsix asset is actually attached, and repairs a release that
  # exists without one rather than treating its mere existence as success. Uses
  # GITHUB_TOKEN, not the deploy key, because creating a release is not a branch push,
  # so it is unaffected by the ruleset. Runs after sync-content so the release notes'
  # CHANGELOG link is live when the release appears, and targets the exact commit
  # sync-content pushed rather than whatever main happens to be when this job runs.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs: [attest, sync-content]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
          path: extension

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sync-payload
          path: sync-payload

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.sync-content.outputs.sha }}
        run: |
          VERSION=$(jq -r .version sync-payload/package.json)
          VSIX=$(find extension -iname '*.vsix' | head -1)
          # gh release create makes the release object first and uploads assets after,
          # so a failed upload leaves a release that exists with no vsix attached. A
          # bare "does the release exist" check would then treat that as success on
          # re-run. Check for the asset itself, and repair rather than skip if it is
          # missing.
          if gh release view "v${VERSION}" --repo "$REPO" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -q '\.vsix$'; then
            echo "Release v${VERSION} already complete, skipping"
            exit 0
          fi
          if gh release view "v${VERSION}" --repo "$REPO" &>/dev/null; then
            echo "Release v${VERSION} exists but is missing the vsix asset, repairing"
            gh release upload "v${VERSION}" "$VSIX" sync-payload/sbom.cdx.json \
              --repo "$REPO" --clobber
            exit 0
          fi
          # SBOM rides along so every released version has an immutable one that
          # procurement can fetch without asking us.
          gh release create "v${VERSION}" "$VSIX" sync-payload/sbom.cdx.json \
            --repo "$REPO" \
            --title "v${VERSION}" \
            --notes "See [CHANGELOG](https://github.com/dbcodeio/public/blob/main/CHANGELOG.md) for details." \
            --target "$SHA" \
            --latest

  publish-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs: [attest, create-release]
    steps:
      # Sparse checkout of the pinned tooling only. The repository root holds the
      # extension's own package.json, synced there on every release, so installing
      # from the root would resolve the extension's dependency tree instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/release-tools
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # Only .github/release-tools is checked out, so action-setup cannot find a
        # package.json at the root - pin explicitly (keep in sync with its
        # packageManager field).
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
          path: extension
      # --frozen-lockfile so nothing resolves at release time: every transitive
      # dependency is pinned by integrity hash before VSCE_PAT is in scope.
      - run: pnpm install --frozen-lockfile
        working-directory: .github/release-tools
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSIX=$(find extension -iname '*.vsix' | head -1)
          ./.github/release-tools/node_modules/.bin/vsce publish \
            --no-git-tag-version --no-update-package-json --packagePath "$VSIX"

  publish-open-vsx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs: [attest, create-release]
    steps:
      # Sparse checkout of the pinned tooling only. See the note in
      # publish-marketplace for why the repository root is not used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/release-tools
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
          path: extension
      - run: pnpm install --frozen-lockfile
        working-directory: .github/release-tools
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          VSIX=$(find extension -iname '*.vsix' | head -1)
          # OVSX_PAT is already in the environment; ovsx reads it from there. Passing
          # -p "$OVSX_PAT" too would put the token on the process command line.
          ./.github/release-tools/node_modules/.bin/ovsx publish "$VSIX"

  # Triggers the www repo workflow to update the website changelog.
  trigger-www-repo-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [attest, create-release]
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.TOKEN_FOR_WWW_REPO_ACTIONS }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'dbcodeio',
              repo: 'www',
              workflow_id: 'ci.yml',
              ref: 'main'
            })
